

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="description"
            content="Contact White Water Rafting Company for rafting reservations, questions, and information about our river adventures.">

        <meta name="author" content="John Otieno">

        <title>White Water Rafting Company | Contact Us</title>

        <link rel="stylesheet" href="styles/contact.css">
    </head>

    <body>

        <header>
            <img src="images/z-raftingbw.png" alt="White Water Rafting Company logo">

            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </header>

        <main>

            <div class="contact-header">
                <h1>White Water Rafting Company</h1>

                <p>
                    <strong>123 Main River Street</strong><br>
                    Kolob, California<br>
                    <strong>+1 999 999 9999</strong><br>
                    <strong>info@whitewater.com</strong>
                </p>
            </div>

            <section class="contact-info" aria-label="Company location and contact form">

                <div class="map-container">
                    <iframe src="https://www.google.com/maps?q=Kolob+Canyons,+Utah&output=embed"
                        title="Map showing the location of White Water Rafting Company" width="100%" height="300"
                        loading="lazy">
                    </iframe>
                </div>

                <div class="contact-form">

                    <h2>Contact Us</h2>

                    <form action="#" method="post">

                        <label for="name">Name</label>

                        <input type="text" id="name" name="name" placeholder="Your name" required>

                        <label for="email">Email</label>

                        <input type="email" id="email" name="email" placeholder="Your email" required>

                        <fieldset>
                            <legend>Message Purpose</legend>

                            <label for="general">
                                <input type="radio" id="general" name="purpose" value="general" required>

                                General Inquiry
                            </label>

                            <label for="reservation">
                                <input type="radio" id="reservation" name="purpose" value="reservation">

                                Reservation Question
                            </label>

                            <label for="suggestion">
                                <input type="radio" id="suggestion" name="purpose" value="suggestion">

                                Website Suggestion
                            </label>

                        </fieldset>

                        <label for="message">Message</label>

                        <textarea id="message" name="message" placeholder="Type your message here" required></textarea>

                        <label for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter" value="yes">

                            Please subscribe me to the monthly newsletter
                        </label>

                        <button type="submit" class="button">
                            Get in Touch!
                        </button>

                    </form>

                </div>

            </section>

            <section class="employee-section">

                <h2>We Are Here to Serve You</h2>

                <div class="employees">

                    <figure>
                        <img src="images/emp2peg.jpeg"
                            alt="River guide ready to help visitors prepare for a rafting adventure">

                        <figcaption>River Guide</figcaption>
                    </figure>

                    <figure>
                        <img src="images/emp3jpeg.jpeg"
                            alt="Safety coordinator helping maintain safe river rafting experiences">

                        <figcaption>Safety Coordinator</figcaption>
                    </figure>

                    <figure>
                        <img src="images/emp4.jpeg"
                            alt="Customer experience manager assisting rafting company visitors">

                        <figcaption>Customer Experience Manager</figcaption>
                    </figure>

                </div>

            </section>

        </main>

        <footer>

            <p>
                &copy; 2026 White Water Rafting Company - John Otieno
            </p>

            <nav class="socialmedia" aria-label="Social media links">

                <a href="https://www.pinterest.com/" aria-label="Visit Pinterest">

                    <img src="images/pinterest.svg" width="75" height="75" alt="Pinterest">
                </a>

                <a href="https://www.facebook.com/" aria-label="Visit Facebook">

                    <img src="images/facebook-bw.svg" width="75" height="75" alt="Facebook">
                </a>

                <a href="https://www.snapchat.com/" aria-label="Visit Snapchat">

                    <img src="images/snapchat-square.svg" width="75" height="75" alt="Snapchat">
                </a>

            </nav>

        </footer>

    </body>

</html>
